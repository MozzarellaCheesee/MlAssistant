[tool.ruff]
line-length = 120
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP", "C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters through calls in defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
